name: Update lists

on:
  schedule:
    - cron: "17 3 * * *"   # tous les jours à 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [asns.txt, scripts/**]

permissions:
  contents: write

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # tête de branche, pas le SHA de l'événement

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate lists
        run: python3 scripts/generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add output/
            if git diff --cached --quiet; then
              echo "Aucun changement"; exit 0
            fi
            git commit -q -m "chore: update lists $(date -u +%F)"
            git push && exit 0
            echo "Push rejeté (tentative $attempt), on se recale sur origin"
            cp -r output /tmp/output
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            rm -rf output && cp -r /tmp/output output && rm -rf /tmp/output
          done
          exit 1
